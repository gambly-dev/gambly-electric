name: Deploy Electric

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

env:
  EKS_CLUSTER: gambly-eks-prod
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "namespace=gambly-${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: Check if deployment is configured
        id: gate
        run: |
          VALUES_FILE="k8s/values-${{ steps.env.outputs.environment }}.env"
          if [ ! -f "$VALUES_FILE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=Values file ${VALUES_FILE} not found" >> "$GITHUB_OUTPUT"
          elif grep -q 'REPLACE_ME' "$VALUES_FILE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=Placeholders still present in ${VALUES_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=Deployment configured" >> "$GITHUB_OUTPUT"
          fi

      - name: Check AWS deploy credentials availability
        id: creds
        run: |
          if [ -z "${{ secrets.DEPLOYER_AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.DEPLOYER_AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=AWS deploy secrets are unavailable in this workflow context" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "reason=AWS deploy secrets available" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.gate.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOYER_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOYER_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download environment file
        if: steps.gate.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        run: |
          aws s3 cp "s3://gambly-env/${{ steps.env.outputs.environment }}/gambly-electric.env" .env

      - name: Install kubectl
        if: steps.gate.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        uses: azure/setup-kubectl@v4

      - name: Update EKS kubeconfig
        if: steps.gate.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        run: |
          aws eks update-kubeconfig --region "${{ env.AWS_REGION }}" --name "${{ env.EKS_CLUSTER }}"

      - name: Render and apply Kubernetes manifests
        if: steps.gate.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        run: |
          NAMESPACE="${{ steps.env.outputs.namespace }}"

          # Load environment-specific values for template substitution
          set -a
          source "k8s/values-${{ steps.env.outputs.environment }}.env"
          set +a

          # Render templates into a temporary directory
          RENDERED_DIR=$(mktemp -d)
          for tpl in k8s/base/*.yaml; do
            envsubst < "$tpl" > "${RENDERED_DIR}/$(basename "$tpl")"
          done

          # Create/update secret from the .env downloaded from S3
          kubectl create secret generic gambly-electric-env \
            --namespace "$NAMESPACE" \
            --from-env-file=.env \
            --dry-run=client -o yaml | kubectl apply -f -

          # Apply manifests in dependency order
          kubectl apply -f "${RENDERED_DIR}/csidriver-efs.yaml"
          kubectl apply -f "${RENDERED_DIR}/pv.yaml"
          kubectl apply -f "${RENDERED_DIR}/pvc.yaml"
          kubectl apply -f "${RENDERED_DIR}/deployment.yaml"
          kubectl apply -f "${RENDERED_DIR}/service.yaml"
          kubectl apply -f "${RENDERED_DIR}/ingress.yaml"

      - name: Verify rollout
        if: steps.gate.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        run: |
          kubectl rollout status deployment/gambly-electric -n "${{ steps.env.outputs.namespace }}" --timeout=5m

      - name: Print status
        if: steps.gate.outputs.skip != 'true' && steps.creds.outputs.available == 'true'
        run: |
          kubectl get deploy,pod,svc,ingress -n "${{ steps.env.outputs.namespace }}" -l app=gambly-electric

      - name: Skip summary
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "Skipping deploy: ${{ steps.gate.outputs.reason }}"

      - name: Skip summary (credentials)
        if: steps.gate.outputs.skip != 'true' && steps.creds.outputs.available != 'true'
        run: |
          echo "Skipping deploy: ${{ steps.creds.outputs.reason }}"
