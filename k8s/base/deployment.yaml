apiVersion: apps/v1
kind: Deployment
metadata:
  name: gambly-electric
  namespace: ${NAMESPACE}
  labels:
    app: gambly-electric
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gambly-electric
  template:
    metadata:
      labels:
        app: gambly-electric
    spec:
      containers:
        - name: gambly-electric
          image: electricsql/electric:1.4.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: gambly-electric-env
          volumeMounts:
            - name: electric-storage
              mountPath: /var/lib/electric/persistent
            - name: electric-shape-db
              mountPath: /var/lib/electric/shape-db
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test "$(curl -so /dev/null -w '%{http_code}' http://localhost:3000/v1/health)" = "200"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
      volumes:
        - name: electric-storage
          persistentVolumeClaim:
            claimName: gambly-electric
        - name: electric-shape-db
          emptyDir: {}
